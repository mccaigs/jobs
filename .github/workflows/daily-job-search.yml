name: Daily UK AI Job Search

on:
  schedule:
    # 07:00 UK time (06:00 UTC, adjusts for BST/GMT automatically via script)
    - cron: '0 6 * * *'
    # 13:00 UK time (12:00 UTC) — afternoon sweep
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (search only, no commit)'
        required: false
        default: 'false'

jobs:
  search:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run daily job search
        id: search
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python scripts/daily_job_search.py

      - name: Commit and push results
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config --global user.email "ai-job-bot@mccaigs.com"
          git config --global user.name "AI Job Search Bot"
          git add jobs/ logs/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            DATE=$(date +'%d-%m-%Y')
            git commit -m "UK AI Daily job search update: ${DATE}"
            git push origin master
            echo "Pushed job search results for ${DATE}"
          fi
